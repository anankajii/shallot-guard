<!doctype html>
<html lang="id">

  <link rel="stylesheet" href="../css/main.css">
</head>
<body>
  <div class="app-shell">
    <aside class="app-sidebar" id="app-sidebar">
      <a class="sidebar-brand" href="dashboard.html">
        <div class="logo-mark" style="background:rgba(255,255,255,.15)">A</div>
        <div><div class="brand-name">Admin Panel</div><div class="brand-sub">SHALLOTGUARD</div></div>
      </a>
      <nav class="sidebar-nav">
        <div class="sidebar-section">Admin</div>
        <a href="dashboard.html"      class="sidebar-link "><span class="icon">◉</span> Dashboard</a>
        <a href="users.html"          class="sidebar-link "><span class="icon"></span> Pengguna</a>
        <a href="subscriptions.html"  class="sidebar-link active"><span class="icon"></span> Langganan</a>
        <a href="settings.html"       class="sidebar-link "><span class="icon"></span> Pengaturan</a>
        <a href="audit-logs.html"     class="sidebar-link "><span class="icon"></span> Audit Logs</a>

        <div class="table-wrap">

            <thead><tr><th>Email</th><th>Paket</th><th>Status</th><th>Mulai</th><th>Aksi</th></tr></thead>

        </div>
