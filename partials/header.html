      <a href="index.html#cara-kerja"    style="padding:7px 13px;border-radius:8px;font-size:.9rem;font-weight:500;color:#3B1829;text-decoration:none;transition:background .15s,color .15s" onmouseover="this.style.background='#F9DDE8';this.style.color='#5A173F'" onmouseout="this.style.background='';this.style.color='#3B1829'">Cara Kerja</a>

    </nav>

    <!-- CTA + Hamburger -->
    <div style="display:flex;align-items:center;gap:.75rem">
      <a id="nav-login-btn" href="login.html"
        style="display:none;align-items:center;justify-content:center;padding:9px 18px;border-radius:10px;font-size:.875rem;font-weight:600;color:#5A173F;text-decoration:none;transition:background .15s"
        onmouseover="this.style.background='#F9DDE8'"

        Masuk

        aria-label="Buka menu"

        <svg id="close-icon"     width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" style="display:none"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>

  <!-- Mobile Drawer -->

    <a href="index.html#solusi"          style="padding:11px 14px;border-radius:10px;font-size:.9375rem;font-weight:500;color:#202923;text-decoration:none;transition:background .12s" onmouseover="this.style.background='#F0EEE8'" onmouseout="this.style.background=''">Solusi</a>

    <a href="index.html#harga-dan-paket" style="padding:11px 14px;border-radius:10px;font-size:.9375rem;font-weight:500;color:#202923;text-decoration:none;transition:background .12s" onmouseover="this.style.background='#F0EEE8'" onmouseout="this.style.background=''">Harga &amp; Paket</a>
    <a href="index.html#tentang-kami"    style="padding:11px 14px;border-radius:10px;font-size:.9375rem;font-weight:500;color:#202923;text-decoration:none;transition:background .12s" onmouseover="this.style.background='#F0EEE8'" onmouseout="this.style.background=''">Tentang Kami</a>
    <div style="display:flex;gap:.75rem;padding-top:.75rem;margin-top:.5rem;border-top:1px solid #E4E8E1">
      <a id="nav-cta-btn" href="login.html" style="flex:1;text-align:center;padding:11px;border-radius:10px;font-size:.9rem;font-weight:600;color:#5A173F;border:1.5px solid #E4E8E1;text-decoration:none;transition:background .12s" onmouseover="this.style.background='#F0EEE8'" onmouseout="this.style.background=''">Masuk</a>
      <a id="nav-cta-btn" href="login.html" style="flex:1;text-align:center;padding:11px;border-radius:10px;font-size:.9rem;font-weight:700;background:#5A173F;color:#ffffff;text-decoration:none;transition:background .12s" onmouseover="this.style.background='#7D2449'" onmouseout="this.style.background='#5A173F'">Daftar Gratis</a>
    </div>
  </div>
</header>

<script>
(function() {
  var header     = document.getElementById('site-header');
  var menuBtn    = document.getElementById('mobile-menu-btn');
  var menu       = document.getElementById('mobile-menu');
  var hamburger  = document.getElementById('hamburger-icon');
  var closeIco   = document.getElementById('close-icon');
  var loginBtn   = document.getElementById('nav-login-btn');
  var desktopNav = document.getElementById('landing-desktop-nav');

  // Responsive: show/hide elements based on viewport
  function applyResponsive() {
    var w = window.innerWidth;
    if (w >= 1024) {
      desktopNav.style.display = 'flex';
      menuBtn.style.display    = 'none';
      loginBtn.style.display   = 'inline-flex';
    } else if (w >= 640) {
      desktopNav.style.display = 'none';
      menuBtn.style.display    = 'flex';
      loginBtn.style.display   = 'inline-flex';
    } else {
      desktopNav.style.display = 'none';
      menuBtn.style.display    = 'flex';
      loginBtn.style.display   = 'none';
    }
  }
  applyResponsive();
  window.addEventListener('resize', applyResponsive);

  // Scroll: add shadow to header
  window.addEventListener('scroll', function() {
    if (window.scrollY > 10) {
      header.style.borderBottomColor = '#E6DDE6';
      header.style.boxShadow = '0 2px 12px rgba(90,23,63,.08)';
    } else {
      header.style.borderBottomColor = '#E6DDE6';
      header.style.boxShadow = 'none';
    }
  }, { passive: true });

  // Hamburger toggle
  var menuOpen = false;
  menuBtn.addEventListener('click', function() {
    menuOpen = !menuOpen;
    menu.style.display    = menuOpen ? 'flex'   : 'none';
    hamburger.style.display = menuOpen ? 'none' : 'block';
    closeIco.style.display  = menuOpen ? 'block': 'none';
  });

  // Close menu on link click
  menu.querySelectorAll('a').forEach(function(a) {
    a.addEventListener('click', function() {
      menuOpen = false;
      menu.style.display      = 'none';
      hamburger.style.display = 'block';
      closeIco.style.display  = 'none';
    });
  });

  // Active nav on scroll
  var sections = document.querySelectorAll('section[id]');
  var navLinks = document.querySelectorAll('#landing-desktop-nav a');
  if (sections.length && navLinks.length) {
    var io = new IntersectionObserver(function(entries) {
      entries.forEach(function(e) {
        if (e.isIntersecting) {
          var id = e.target.id;
          navLinks.forEach(function(a) {
            var active = a.getAttribute('href').endsWith('#' + id);
            a.style.background  = active ? '#F9DDE8' : '';
            a.style.color       = active ? '#5A173F' : '#748078';
            a.style.fontWeight  = active ? '600'     : '500';
          });
        }
      });
    }, { rootMargin: '-20% 0px -70% 0px' });
    sections.forEach(function(s) { io.observe(s); });
  }
})();
</script>
