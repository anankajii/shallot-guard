<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lupa Password — SHALLOTGUARD</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <link rel="stylesheet" href="css/tailwind.css">
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
<main class="login-shell">
  <section class="login-side">
    <a class="brand" href="index.html">SHALLOT<b>GUARD</b></a>
    <h1>Pulihkan akses akun Anda.</h1>
    <p>Kami akan mengirimkan tautan reset melalui email terdaftar.</p>
  </section>
  <section class="login-card">
    <h1>Lupa Password</h1>
    <p class="hint">Pada Firebase aktif, email reset dikirim oleh Firebase Authentication.</p>
    <form id="forgot-form">
      <div class="form-row">
        <label for="forgot-email">Email</label>
        <input id="forgot-email" type="email" required autocomplete="email" placeholder="nama@email.com">
      </div>
      <button class="btn wide" type="submit">Kirim Tautan Reset (Demo)</button>
    </form>
    <p id="forgot-message" class="hint" role="alert" style="margin-top:10px"></p>
    <p class="hint" style="margin-top:16px"><a href="login.html">← Kembali masuk</a></p>
  </section>
</main>
<div id="toast-root" aria-live="polite"></div>
<script type="module" src="js/pages/forgot-password.js"></script>
</body>
</html>
