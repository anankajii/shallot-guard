<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Daftar — SHALLOTGUARD</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
  <style>
    .auth-shell { min-height:100vh; display:grid; grid-template-columns:1fr 1fr; }
    .auth-side  { padding:3rem clamp(2rem,8vw,5rem); background:linear-gradient(145deg,#5A173F,#7D2449); color:#fff; display:flex; flex-direction:column; }
    .auth-side .back { display:flex; align-items:center; gap:.75rem; text-decoration:none; margin-bottom:auto; }
    .auth-side .logo-mark { width:38px; height:38px; border-radius:10px; background:rgba(255,255,255,.18); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; color:#fff; flex-shrink:0; }
    .auth-side h1 { font-family:'Playfair Display',Georgia,serif; font-size:clamp(1.75rem,3.5vw,2.75rem); font-weight:700; line-height:1.1; margin:4rem 0 1rem; }
    .auth-side p  { color:rgba(255,255,255,.75); font-size:1rem; line-height:1.65; margin:0; }
    .auth-panel   { display:flex; align-items:center; justify-content:center; padding:2rem; background:var(--surface); }
    .auth-box     { width:100%; max-width:420px; }
    .auth-label   { display:inline-flex; align-items:center; gap:.4rem; padding:4px 12px; border-radius:999px; background:var(--sage); font-size:.75rem; font-weight:700; color:var(--forest); text-transform:uppercase; letter-spacing:.06em; margin-bottom:1.5rem; }
    .auth-box h1  { font-family:'Playfair Display',Georgia,serif; font-size:1.75rem; font-weight:700; color:var(--forest); margin:0 0 .5rem; }
    .auth-box p   { font-size:.875rem; color:var(--muted); margin:0 0 1.75rem; line-height:1.55; }
    .msg { font-size:.875rem; min-height:1.25rem; margin:.75rem 0 0; }
    @media (max-width: 768px) { .auth-shell { grid-template-columns:1fr; } .auth-side { display:none; } }
  </style>
</head>
<body>
<div class="auth-shell">

  <!-- Left panel -->
  <div class="auth-side">
    <a class="back" href="index.html">
      <div class="logo-mark">SG</div>
      <div>
        <div style="font-size:1rem;font-weight:700;color:#fff">SHALLOTGUARD</div>
        <div style="font-size:.65rem;color:rgba(255,255,255,.5);text-transform:uppercase;letter-spacing:.08em">Agritech Nganjuk</div>
      </div>
    </a>
    <h1>Mulai catatan tani digital Anda.</h1>
    <p>Daftar gratis, pantau budidaya bawang merah dengan lebih cerdas bersama petani Nganjuk.</p>
  </div>

  <!-- Right panel -->
  <div class="auth-panel">
    <div class="auth-box">
      <span class="auth-label">Demo Mode</span>
      <h1>Buat Akun</h1>
      <p>Registrasi Firebase akan aktif setelah kredensial diisi. Mode demo menyimpan data lokal.</p>

      <form id="register-form" style="display:flex;flex-direction:column;gap:.875rem">
        <div class="form-group" style="margin:0">
          <label class="form-label">Nama Lengkap</label>
          <input class="form-input" id="reg-name" name="name" required placeholder="Nama Anda">
        </div>
        <div class="form-group" style="margin:0">
          <label class="form-label">Email</label>
          <input class="form-input" id="reg-email" name="email" type="email" required autocomplete="email" placeholder="nama@email.com">
        </div>
        <div class="form-group" style="margin:0">
          <label class="form-label">Password</label>
          <input class="form-input" id="reg-password" name="password" type="password" required minlength="8" autocomplete="new-password" placeholder="Minimal 8 karakter">
        </div>
        <button class="btn btn-wide" type="submit" style="margin-top:.5rem">Daftar (Demo)</button>
      </form>

      <p id="register-message" class="msg" role="alert"></p>

      <p style="font-size:.875rem;color:var(--muted);margin-top:1.25rem;text-align:center">
        Sudah punya akun? <a href="login.html" style="color:var(--forest);font-weight:600">Masuk</a>
      </p>
    </div>
  </div>
</div>

<div id="toast-root" aria-live="polite"></div>
<script type="module" src="js/pages/register.js"></script>
</body>
</html>
